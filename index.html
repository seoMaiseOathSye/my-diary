<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私の日記</title>
  <style>
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 24px;
      background: #fff;
      color: #333;
      font-family: sans-serif;
      line-height: 2;
    }
    h1 {
      font-size: 24px;
      font-weight: normal;
      margin-bottom: 48px;
    }
    article {
      margin-bottom: 40px;
    }
    time {
      display: block;
      margin-bottom: 8px;
      color: #888;
      font-size: 13px;
    }
    p {
      margin: 0;
      white-space: pre-wrap;
    }
    footer {
      margin-top: 64px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>私の日記</h1>
  <main>
    <article>
      <time datetime="2026-10-12">2026年10月12日</time>
      <p>ここから始めます。</p>
    </article>
  </main>
  <footer>個人的な記録</footer>
</body>
</html>
